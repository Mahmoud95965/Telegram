<div class="min-h-screen flex items-center justify-center bg-gray-100 p-6">
  <div class="w-full max-w-md bg-white shadow-xl rounded-xl p-8">
    <div class="text-center mb-6">
      <div class="flex items-center justify-center space-x-2">
        <i class="icon icon-tg-logo"></i>
        <i class="icon icon-tg-title"></i>
      </div>
      <h2 class="mt-4 text-2xl font-semibold text-gray-800">Welcome</h2>
      <p class="text-gray-500">Sign in to continue to Telegram Web</p>
    </div>

    <div class="space-y-4">
      <button class="w-full inline-flex items-center justify-center px-4 py-2 border border-gray-300 rounded-md shadow-sm bg-white hover:bg-gray-50"
              ng-click="loginWithGoogle()" ng-disabled="ui.loading">
        <span class="mr-2">🔐</span>
        <span>Sign in with Google</span>
      </button>

      <div class="relative">
        <div class="absolute inset-0 flex items-center" aria-hidden="true">
          <div class="w-full border-t border-gray-200"></div>
        </div>
        <div class="relative flex justify-center">
          <span class="px-3 bg-white text-sm text-gray-500">Or continue with email</span>
        </div>
      </div>

      <div class="space-y-3">
        <input type="email" class="w-full rounded-md border-gray-300 focus:border-blue-500 focus:ring-blue-500" placeholder="Email" ng-model="form.email"/>
        <input type="password" class="w-full rounded-md border-gray-300 focus:border-blue-500 focus:ring-blue-500" placeholder="Password" ng-model="form.password"/>

        <div class="flex items-center justify-between">
          <button class="px-4 py-2 rounded-md bg-blue-600 text-white hover:bg-blue-700" ng-click="loginWithEmail()" ng-disabled="ui.loading">Login</button>
          <button class="px-4 py-2 rounded-md bg-gray-100 text-gray-800 hover:bg-gray-200" ng-click="registerWithEmail()" ng-disabled="ui.loading">Register</button>
        </div>

        <div class="text-right">
          <a class="text-sm text-blue-600 hover:underline cursor-pointer" ng-click="forgotPassword()">Forgot Password?</a>
        </div>
      </div>

      <p class="text-sm text-red-600" ng-if="ui.error" ng-bind="ui.error"></p>
    </div>
  </div>
</div>
